# Weekly pull requests for outdated or vulnerable dependencies; the CI checks
# run on each one. Security fixes arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for all minor and patch updates.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
