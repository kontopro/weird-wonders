# Weekly pull requests for outdated or vulnerable dependencies; the CI checks
# run on each one. Security fixes arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the Go compiler) is not supported by typescript-eslint
      # yet; remove this once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Recharts 3 changes the chart component's types (src/components/ui/chart.tsx,
      # not used yet): upgrade together with its first real use.
      - dependency-name: recharts
        update-types: [version-update:semver-major]
      # Node.js types follow the Node.js version the site runs on (22, as in
      # CI); raise both together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      # One pull request for all minor and patch updates.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
